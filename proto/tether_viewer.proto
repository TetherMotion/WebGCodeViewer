syntax = "proto3";

package tether.viewer.v1;

import "google/protobuf/empty.proto";

// ============================================================================
// Envelope — top-level message sent over WebSocket binary frames.
// Mirrors the Noxeco NoxvisionEnvelope pattern: a single oneof discriminates
// between auth, request, response, and cancel.
// ============================================================================

message AuthRequest {
  string token = 1;
}

message CancelRequest {
  uint32 call_id = 1;
}

message TetherViewerEnvelope {
  oneof envelope {
    AuthRequest auth = 1;
    TetherViewerRequest request = 2;
    TetherViewerResponse response = 3;
    CancelRequest cancel = 4;
  }
}

// ============================================================================
// Request — client → server RPC call. call_id correlates response.
// ============================================================================

message TetherViewerRequest {
  uint32 call_id = 1;
  oneof request {
    // Job management
    UploadGcodeRequest upload_gcode = 5;
    ProcessJobRequest process_job = 6;
    GetJobStatusRequest get_job_status = 7;
    GetBinaryRequest get_binary = 8;
    GetBlocksRequest get_blocks = 9;
    GetStatisticsRequest get_statistics = 10;
    GetSegmentsRequest get_segments = 11;
    ListJobsRequest list_jobs = 12;
    DeleteJobRequest delete_job = 13;

    // Z-layer / 3D printing dissection
    GetZLayersRequest get_z_layers = 14;
    GetZLayerBinaryRequest get_z_layer_binary = 15;
    GetZLayerRangeBinaryRequest get_z_layer_range_binary = 16;

    // Server-side G-code analysis (C++ Tether analyzers)
    GetAnalysisRequest get_analysis = 19;
    GetAnalysisDetailsRequest get_analysis_details = 20;

    // Server info
    google.protobuf.Empty ping = 17;
    google.protobuf.Empty get_version = 18;
  }
}

// ============================================================================
// Response — server → client. call_id matches request. done=true for final.
// ============================================================================

message ServerTiming {
  double total_ms = 1;
  double envelope_deser_ms = 2;
  double handler_lookup_ms = 3;
  double request_deser_ms = 4;
  double handler_total_ms = 5;
  double response_ser_send_ms = 6;
}

message TetherViewerResponse {
  uint32 call_id = 1;
  bool done = 2;
  string error_message = 3;
  uint32 error_code = 4;
  ServerTiming server_timing = 183;
  oneof response {
    UploadGcodeResponse upload_gcode = 5;
    ProcessJobResponse process_job = 6;
    GetJobStatusResponse get_job_status = 7;
    BinaryDataResponse get_binary = 8;
    GetBlocksResponse get_blocks = 9;
    GetStatisticsResponse get_statistics = 10;
    GetSegmentsResponse get_segments = 11;
    ListJobsResponse list_jobs = 12;
    DeleteJobResponse delete_job = 13;
    GetZLayersResponse get_z_layers = 14;
    BinaryDataResponse get_z_layer_binary = 15;
    BinaryDataResponse get_z_layer_range_binary = 16;
    PingResponse ping = 17;
    VersionResponse get_version = 18;

    // Server-side G-code analysis results
    AnalysisResultResponse analysis_result = 19;
  }
}

// ============================================================================
// Job management messages
// ============================================================================

message UploadGcodeRequest {
  string gcode_text = 1;
  string filename = 2;
}

message UploadGcodeResponse {
  string job_id = 1;
  string filename = 2;
  string state = 3;
}

message ProcessJobRequest {
  string job_id = 1;
  double sample_rate = 2;
  double max_velocity = 3;
  double max_acceleration = 4;
  double max_jerk = 5;
  string strategy = 6;
}

message ProcessJobResponse {
  string job_id = 1;
  string state = 2;
}

message GetJobStatusRequest {
  string job_id = 1;
}

message GetJobStatusResponse {
  string job_id = 1;
  string state = 2;
  double progress = 3;
  uint32 sample_count = 4;
  double duration = 5;
  double path_length = 6;
  string error_message = 7;
  string warning = 8;
}

message BinaryDataRequest {
  string job_id = 1;
  uint32 fields = 2;   // TTHRFlags bitmask
  uint32 axes = 3;
  double start_time = 4;
  double end_time = 5;
  sint32 seg_start = 6;
  sint32 seg_end = 7;
  uint32 downsample = 8;
}

message GetBinaryRequest {
  string job_id = 1;
  uint32 fields = 2;
  uint32 axes = 3;
  double start_time = 4;
  double end_time = 5;
  sint32 seg_start = 6;
  sint32 seg_end = 7;
  uint32 downsample = 8;
}

message BinaryDataResponse {
  bytes data = 1;  // TTHR binary format
}

message GetBlocksRequest {
  string job_id = 1;
}

message GcodeBlockInfo {
  sint32 block_index = 1;
  sint32 line_number = 2;
  uint32 motion_type = 3;
  string gcode_text = 4;
}

message GetBlocksResponse {
  repeated GcodeBlockInfo blocks = 1;
}

message GetStatisticsRequest {
  string job_id = 1;
}

message AxisStats {
  double min_position = 1;
  double max_position = 2;
  double max_velocity = 3;
  double max_acceleration = 4;
  double max_jerk = 5;
}

message GetStatisticsResponse {
  double duration = 1;
  double path_length = 2;
  uint32 sample_count = 3;
  double max_linear_velocity = 4;
  double max_linear_acceleration = 5;
  double max_linear_jerk = 6;
  double max_curvature = 7;
  double max_centripetal_accel = 8;
  double total_corner_error = 9;
  double max_corner_error = 10;
  bool meets_limits = 11;
  repeated AxisStats axis_stats = 12;
}

message GetSegmentsRequest {
  string job_id = 1;
}

message SegmentInfo {
  sint32 segment_index = 1;
  double start_time = 2;
  double end_time = 3;
  double start_path = 4;
  double end_path = 5;
  uint32 motion_type = 6;
}

message GetSegmentsResponse {
  repeated SegmentInfo segments = 1;
}

message ListJobsRequest {}

message JobSummary {
  string id = 1;
  string filename = 2;
  string state = 3;
  double progress = 4;
  uint32 sample_count = 5;
  double duration = 6;
  double path_length = 7;
}

message ListJobsResponse {
  repeated JobSummary jobs = 1;
}

message DeleteJobRequest {
  string job_id = 1;
}

message DeleteJobResponse {
  bool deleted = 1;
}

// ============================================================================
// Z-layer / 3D printing dissection messages
// ============================================================================

message GetZLayersRequest {
  string job_id = 1;
  double z_tolerance = 2;  // Height tolerance for grouping samples into layers
}

message ZLayerInfo {
  uint32 layer_index = 1;
  double z_height = 2;
  uint32 sample_start = 3;
  uint32 sample_end = 4;
  uint32 sample_count = 5;
  double path_length = 6;
}

message GetZLayersResponse {
  repeated ZLayerInfo layers = 1;
  uint32 total_layers = 2;
  double min_z = 3;
  double max_z = 4;
  double layer_height = 5;
}

message GetZLayerBinaryRequest {
  string job_id = 1;
  uint32 layer_index = 2;
  uint32 fields = 3;
  uint32 axes = 4;
}

message GetZLayerRangeBinaryRequest {
  string job_id = 1;
  uint32 start_layer = 2;
  uint32 end_layer = 3;  // inclusive
  uint32 fields = 4;
  uint32 axes = 5;
}

// ============================================================================
// Server info messages
// ============================================================================

message PingRequest {}

message PingResponse {
  double timestamp = 1;
}

message VersionResponse {
  string version = 1;
  string protocol_version = 2;
}

// ============================================================================
// Server-side G-code analysis messages
// ============================================================================

enum AnalysisSeverity {
  ANALYSIS_SEVERITY_UNSPECIFIED = 0;
  ANALYSIS_SEVERITY_INFO = 1;
  ANALYSIS_SEVERITY_LOW = 2;
  ANALYSIS_SEVERITY_MEDIUM = 3;
  ANALYSIS_SEVERITY_HIGH = 4;
}

message AnalysisMetric {
  string key = 1;
  oneof value {
    double double_value = 2;
    int64 int64_value = 3;
    bool bool_value = 4;
    string string_value = 5;
  }
}

message AnalysisEvent {
  // Stable identifier for the event class / location, e.g. "retraction:12345"
  string id = 1;

  // Source G-code line number (1-based, 0 if unknown)
  int32 line_number = 2;

  // Event type, e.g. "limit_violation", "sharp_turn", "retraction", "arc_candidate"
  string event_type = 3;

  AnalysisSeverity severity = 4;

  // Human-readable description
  string message = 5;

  // Primary numeric metric associated with the event
  double metric_value = 6;

  // Optional additional fields as a JSON string for forward extensibility
  string details_json = 7;
}

message AnalysisSection {
  // Machine-readable section id, e.g. "machine_limit", "retraction", "curvature"
  string section_name = 1;

  // Human-readable display name
  string display_name = 2;

  // Scalar metrics for this section. New analyzers can emit arbitrary
  // key/value pairs without changing the schema.
  repeated AnalysisMetric metrics = 3;

  // Top-N most important events for this section. Full event lists can be
  // fetched paginated via GetAnalysisDetailsRequest.
  repeated AnalysisEvent top_events = 4;

  repeated string recommendations = 5;

  // 0-100 overall score for this section (higher is better)
  double score = 6;

  // Total number of events available on the server for this section
  uint32 total_event_count = 7;

  // True if more events exist than were sent in top_events
  bool has_more_events = 8;
}

message GetAnalysisRequest {
  string job_id = 1;

  // Bit mask of analyzers to run. 0 = all. Bit 0 = machine_limit, 1 = curvature,
  // 2 = arc, 3 = modal, 4 = topology, 5 = efficiency, 6 = retraction,
  // 7 = acceleration, 8 = coordinate, 9 = continuity.
  uint32 analyzer_mask = 2;

  // Max number of top events per section to include in the stream
  uint32 top_event_limit = 3;

  // "summary" = only section scores + counts, "standard" = metrics + top events,
  // "full" = all events (not recommended for huge files)
  string detail_level = 4;

  // If true, server streams one section at a time. Recommended for huge files.
  bool stream = 5;

  // Hard cap on total events across all sections when detail_level != "full"
  uint32 max_event_limit = 6;
}

message GetAnalysisDetailsRequest {
  string job_id = 1;
  string section_name = 2;
  string event_type = 3;  // empty = all event types
  uint32 offset = 4;
  uint32 limit = 5;
}

message AnalysisDetailsResponse {
  string section_name = 1;
  repeated AnalysisEvent events = 2;
  uint32 total = 3;
  bool has_more = 4;
}

message AnalysisProgressUpdate {
  string section_name = 1;      // section currently being processed
  uint32 progress_percent = 2;  // 0-100 overall progress
  string status = 3;            // e.g. "starting", "running", "section_complete", "complete"
}

message AnalysisResultResponse {
  oneof payload {
    AnalysisProgressUpdate progress = 1;
    AnalysisSection section = 2;
    AnalysisDetailsResponse details = 3;
  }

  // True for the final message in a stream or for a unary response
  bool complete = 4;

  // When non-streaming, all completed sections are returned in a single message
  repeated AnalysisSection sections = 5;

  // Sub-section / per-message error; the top-level TetherViewerResponse also
  // carries an error_message field for stream-level errors.
  string error_message = 6;
}
