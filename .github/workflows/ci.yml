name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # C++ server: build + Google Test unit tests
  # ──────────────────────────────────────────────────────────────────────────
  cpp-build-and-test:
    name: C++ build & unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            libdrogon-dev \
            libjsoncpp-dev \
            libprotobuf-dev \
            protobuf-compiler \
            libgtest-dev \
            libgmock-dev

      - name: Cache CMake build
        uses: actions/cache@v5
        with:
          path: |
            build/CMakeCache.txt
            build/CMakeFiles
          key: cmake-${{ runner.os }}-${{ github.job }}-${{ hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt', 'Tether/CMakeLists.txt') }}
          restore-keys: |
            cmake-${{ runner.os }}-${{ github.job }}-

      - name: Configure CMake
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DWGV_BUILD_EXAMPLES=ON -DWGV_BUILD_TESTS=ON -DWGV_BUILD_FRONTEND=OFF

      - name: Build server & tests
        run: cmake --build build --target web_viewer wgv_tests -j$(nproc)

      - name: Run C++ unit tests
        working-directory: build
        run: ./bin/wgv_tests --gtest_color=yes

      - name: Upload build artifact (web_viewer)
        uses: actions/upload-artifact@v5
        with:
          name: web_viewer-bin
          path: build/bin/web_viewer
          if-no-files-found: error
          retention-days: 1

  # ──────────────────────────────────────────────────────────────────────────
  # Frontend: Vitest unit tests + TypeScript typecheck
  # ──────────────────────────────────────────────────────────────────────────
  frontend-tests:
    name: Frontend unit tests & typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout (with submodules for proto)
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install protoc (for proto:generate)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate protobuf TypeScript types
        working-directory: frontend
        run: npm run proto:generate

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Run Vitest unit tests
        working-directory: frontend
        run: npm test -- --reporter=verbose

  # ──────────────────────────────────────────────────────────────────────────
  # E2E: Playwright tests (headless + WebGPU via Chrome)
  # Requires the built web_viewer binary + deployed frontend.
  # ──────────────────────────────────────────────────────────────────────────
  e2e-tests:
    name: Playwright E2E tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [cpp-build-and-test, frontend-tests]

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            libdrogon-dev \
            libjsoncpp-dev \
            libprotobuf-dev \
            protobuf-compiler

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install root dependencies (Playwright)
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Cache CMake build
        uses: actions/cache@v5
        with:
          path: |
            build/CMakeCache.txt
            build/CMakeFiles
          key: cmake-${{ runner.os }}-e2e-${{ hashFiles('CMakeLists.txt', 'Tether/CMakeLists.txt') }}
          restore-keys: |
            cmake-${{ runner.os }}-e2e-

      - name: Build (server + frontend)
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DWGV_BUILD_EXAMPLES=ON -DWGV_BUILD_TESTS=OFF -DWGV_BUILD_FRONTEND=ON
          cmake --build build --target web_viewer wgv_frontend_deploy -j$(nproc)

      - name: Install Google Chrome (for WebGPU project)
        run: |
          wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y /tmp/chrome.deb || sudo apt-get -f install -y

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Playwright test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
