<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#4a9eff">
    <meta name="description" content="WebGPU-based 3D G-code viewer for 3D printing analysis">
    <link rel="manifest" href="manifest.json">
    <title>Tether G-code Viewer</title>
    <!-- Cache-busting ?v= is replaced by build.mjs at build time -->
    <link rel="stylesheet" href="css/viewer.css?v=__BUILD_VERSION__">
</head>
<body>
    <div id="app">
        <div id="top-panel"></div>
        <div id="main-content">
            <div id="viewer-column">
                <div id="canvas-container">
                    <canvas id="webgpu-canvas"></canvas>
                    <div id="nav-cube-container"></div>
                    <div id="error-message" style="display:none;"></div>
                    <div id="loading-overlay" style="display:none;">
                        <div class="spinner"></div>
                        <p id="loading-text">Loading...</p>
                    </div>
                </div>
                <div id="miniplot-section">
                    <div id="miniplot-toolbar">
                        <label id="miniplot-quantity-label">Quantity:
                            <select id="miniplot-quantity-select">
                                <option value="Velocity" selected>Velocity</option>
                                <option value="Acceleration">Acceleration</option>
                                <option value="Jerk">Jerk</option>
                                <option value="PA Offset">PA Offset</option>
                                <option value="Extruder Velocity">Extruder Velocity</option>
                            </select>
                        </label>
                        <label id="miniplot-algorithm-label">PA Algorithm:
                            <select id="miniplot-algorithm-select">
                                <option value="0" selected>Linear</option>
                                <option value="1">PowerLaw</option>
                                <option value="2">CrossWLF</option>
                                <option value="3">LTI Deconv</option>
                                <option value="4">LPV Deconv</option>
                            </select>
                        </label>
                        <span id="miniplot-label"></span>
                    </div>
                    <div id="miniplot-container">
                        <canvas id="miniplot-canvas"></canvas>
                    </div>
                </div>
            </div>
            <div id="gcode-panel"></div>
        </div>
    </div>
    <!-- Cache-busting ?v= is replaced by build.mjs at build time -->
    <script type="module" src="dist/tether-viewer.js?v=__BUILD_VERSION__"></script>
</body>
</html>
